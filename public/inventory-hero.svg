<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background shapes -->
  <circle cx="200" cy="150" r="120" fill="#8000ff" opacity="0.06"/>
  <circle cx="200" cy="150" r="80" fill="#8000ff" opacity="0.08"/>

  <!-- Warehouse/shelf -->
  <rect x="100" y="100" width="200" height="140" rx="8" fill="white" stroke="#8000ff" stroke-width="2"/>

  <!-- Shelves -->
  <line x1="100" y1="140" x2="300" y2="140" stroke="#e5e7eb" stroke-width="1.5"/>
  <line x1="100" y1="180" x2="300" y2="180" stroke="#e5e7eb" stroke-width="1.5"/>
  <line x1="100" y1="220" x2="300" y2="220" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- Boxes on shelves -->
  <rect x="115" y="110" width="24" height="24" rx="3" fill="#8000ff" opacity="0.2" stroke="#8000ff" stroke-width="1"/>
  <rect x="145" y="110" width="24" height="24" rx="3" fill="#8000ff" opacity="0.3" stroke="#8000ff" stroke-width="1"/>
  <rect x="175" y="110" width="24" height="24" rx="3" fill="#8000ff" opacity="0.15" stroke="#8000ff" stroke-width="1"/>

  <rect x="115" y="150" width="24" height="24" rx="3" fill="#FFB835" opacity="0.3" stroke="#FFB835" stroke-width="1"/>
  <rect x="145" y="150" width="24" height="24" rx="3" fill="#FFB835" opacity="0.2" stroke="#FFB835" stroke-width="1"/>
  <rect x="175" y="150" width="24" height="24" rx="3" fill="#8000ff" opacity="0.2" stroke="#8000ff" stroke-width="1"/>
  <rect x="205" y="150" width="24" height="24" rx="3" fill="#8000ff" opacity="0.25" stroke="#8000ff" stroke-width="1"/>

  <rect x="115" y="190" width="24" height="24" rx="3" fill="#8000ff" opacity="0.1" stroke="#8000ff" stroke-width="1"/>
  <rect x="145" y="190" width="24" height="24" rx="3" fill="#22c55e" opacity="0.2" stroke="#22c55e" stroke-width="1"/>
  <rect x="175" y="190" width="24" height="24" rx="3" fill="#22c55e" opacity="0.3" stroke="#22c55e" stroke-width="1"/>
  <rect x="205" y="190" width="24" height="24" rx="3" fill="#FFB835" opacity="0.2" stroke="#FFB835" stroke-width="1"/>
  <rect x="235" y="190" width="24" height="24" rx="3" fill="#8000ff" opacity="0.15" stroke="#8000ff" stroke-width="1"/>

  <!-- Clipboard overlay -->
  <g transform="translate(240, 85)">
    <rect width="60" height="80" rx="6" fill="white" stroke="#8000ff" stroke-width="1.5" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.1))"/>
    <rect x="18" y="-4" width="24" height="10" rx="3" fill="#8000ff"/>
    <line x1="12" y1="20" x2="48" y2="20" stroke="#e5e7eb" stroke-width="1.5"/>
    <line x1="12" y1="32" x2="42" y2="32" stroke="#e5e7eb" stroke-width="1.5"/>
    <line x1="12" y1="44" x2="38" y2="44" stroke="#e5e7eb" stroke-width="1.5"/>
    <circle cx="12" cy="56" r="4" fill="#22c55e" opacity="0.3"/>
    <line x1="20" y1="56" x2="40" y2="56" stroke="#e5e7eb" stroke-width="1.5"/>
    <!-- Checkmarks -->
    <path d="M9 19l3 3 6-6" stroke="#22c55e" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M9 31l3 3 6-6" stroke="#22c55e" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M9 43l3 3 6-6" stroke="#8000ff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Chart overlay -->
  <g transform="translate(80, 60)">
    <rect width="55" height="45" rx="6" fill="white" stroke="#FFB835" stroke-width="1.5" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.1))"/>
    <polyline points="10,32 20,22 30,26 45,14" stroke="#8000ff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="20" cy="22" r="2" fill="#8000ff"/>
    <circle cx="30" cy="26" r="2" fill="#8000ff"/>
    <circle cx="45" cy="14" r="2" fill="#FFB835"/>
  </g>
</svg>
