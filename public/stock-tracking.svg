<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <circle cx="200" cy="150" r="110" fill="#8000ff" opacity="0.05"/>

  <!-- Dashboard card -->
  <rect x="80" y="60" width="240" height="180" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1.5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.08))"/>

  <!-- Header -->
  <rect x="80" y="60" width="240" height="40" rx="12" fill="#8000ff" opacity="0.05"/>
  <circle cx="100" cy="80" r="6" fill="#8000ff" opacity="0.3"/>
  <rect x="112" y="76" width="60" height="8" rx="4" fill="#8000ff" opacity="0.2"/>

  <!-- Stat cards row -->
  <rect x="95" y="112" width="65" height="40" rx="6" fill="#8000ff" opacity="0.08" stroke="#8000ff" stroke-width="0.5"/>
  <rect x="100" y="118" width="30" height="6" rx="3" fill="#8000ff" opacity="0.3"/>
  <rect x="100" y="130" width="20" height="10" rx="2" fill="#8000ff" opacity="0.5"/>

  <rect x="168" y="112" width="65" height="40" rx="6" fill="#22c55e" opacity="0.08" stroke="#22c55e" stroke-width="0.5"/>
  <rect x="173" y="118" width="30" height="6" rx="3" fill="#22c55e" opacity="0.3"/>
  <rect x="173" y="130" width="20" height="10" rx="2" fill="#22c55e" opacity="0.5"/>

  <rect x="241" y="112" width="65" height="40" rx="6" fill="#FFB835" opacity="0.08" stroke="#FFB835" stroke-width="0.5"/>
  <rect x="246" y="118" width="30" height="6" rx="3" fill="#FFB835" opacity="0.3"/>
  <rect x="246" y="130" width="20" height="10" rx="2" fill="#FFB835" opacity="0.5"/>

  <!-- Bar chart -->
  <rect x="95" y="200" width="20" height="25" rx="3" fill="#8000ff" opacity="0.6"/>
  <rect x="120" y="185" width="20" height="40" rx="3" fill="#8000ff" opacity="0.8"/>
  <rect x="145" y="195" width="20" height="30" rx="3" fill="#8000ff" opacity="0.5"/>
  <rect x="170" y="175" width="20" height="50" rx="3" fill="#8000ff"/>
  <rect x="195" y="190" width="20" height="35" rx="3" fill="#8000ff" opacity="0.7"/>
  <rect x="220" y="205" width="20" height="20" rx="3" fill="#FFB835" opacity="0.6"/>
  <rect x="245" y="195" width="20" height="30" rx="3" fill="#FFB835" opacity="0.8"/>

  <!-- Notification badge -->
  <circle cx="310" cy="70" r="14" fill="#ef4444" opacity="0.15"/>
  <circle cx="310" cy="70" r="8" fill="#ef4444"/>
  <text x="310" y="74" text-anchor="middle" fill="white" font-size="10" font-weight="bold">3</text>
